    - id: b1f0c2a4-6d1e-4c8a-9a51-0f3e7c2d1a01
      markdown: |-
        ## JustGo_mobile: 5-minute windows where avg view duration exceeded 30 s
        Built on the same `makeTimeseries { avg_ms = avg(toDouble(duration)) }, by: { os.name }` as the JustGo_mobile chart, at a **5-minute interval**. The first tile lists every window where an OS's average went over **30 s**, newest first (`Time start`, `avg_ms` in ms, `OS`). The second tile shows the same windows **one row each**, with the **3 slowest services tagged `JustGo`** side by side: for each of #1–#3 a `service`, `response (ms)` and `requests` column for those 5 minutes. Default timeframe: last 24 hours.

        - `duration` is stored in nanoseconds, so the threshold is `30000000000` (30 s) and `avg_ms` is divided by 1,000,000 for display.
        - Service response time (`dt.service.request.response_time`, microseconds) is shown in ms; request count is `dt.service.request.count` summed over the window.
        - Beyond a few days Dynatrace widens the 5-minute interval (both tiles widen together), so each row then covers a longer window.
      type: markdown
    - drilldownPath: []
      filterSegments: []
      id: b1f0c2a4-6d1e-4c8a-9a51-0f3e7c2d1a02
      previousFilterSegments: []
      showInput: true
      state:
        davis:
          davisVisualization:
            isAvailable: true
          includeLogs: true
        input:
          timeframe:
            from: now()-24h
            to: now()
          value: |-
            fetch user.events
            | filter characteristics.has_view_summary == true
            | filter frontend.name == "JustGo_mobile"
            | makeTimeseries { avg_ms = avg(toDouble(duration)) }, by: { os.name }, interval: 5m
            // one row per OS per 5-minute window
            | fieldsAdd pts = iCollectArray(record(time_start = timeframe[start] + interval * iIndex(), v = avg_ms[]))
            | expand pts
            // duration is in nanoseconds: 30 s = 30,000,000,000 ns
            | filter pts[v] > 30000000000
            | fields `Time start` = pts[time_start], avg_ms = round(pts[v] / 1000000, decimals: 0), OS = os.name
            | sort `Time start` desc
        querySettings:
          defaultSamplingRatio: 10
          defaultScanLimitGbytes: 500
          enableSampling: false
          maxResultMegaBytes: 1
          maxResultRecords: 1000
        state: idle
        visualization: table
        visualizationSettings:
          autoSelectVisualization: false
          chartSettings: {}
          table:
            hideColumnsForLargeResults: false
      title: JustGo_mobile 5-minute windows with avg view duration > 30 s
      type: dql
