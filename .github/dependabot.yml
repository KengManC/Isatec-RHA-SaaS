version: 2
updates:
  # Keep the GitHub Actions used by the workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, skip-changelog]
  # npm dependencies of every custom Dynatrace app under apps/
  - package-ecosystem: npm
    directories: ["/apps/*"]
    schedule: { interval: weekly }
    labels: [dependencies, skip-changelog]
    open-pull-requests-limit: 5
