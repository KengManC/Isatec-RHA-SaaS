# Runs on every pull request into main.
#  - validate:  JSON/YAML syntax + "[RHA] " name prefix (no Dynatrace access needed)
#  - changelog: CHANGELOG.md must be updated (add the "skip-changelog" label to bypass)
#  - dt-diff:   dtctl diff of every changed dashboard/notebook/workflow, posted as a PR comment
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate changed resource files
        run: |
          set -euo pipefail
          files=$(scripts/ci/changed-resources.sh "origin/${{ github.base_ref }}" HEAD)
          [ -z "$files" ] && { echo "No dashboard/notebook/workflow changes."; exit 0; }
          fail=0
          for f in $files; do
            case "$f" in
              *.json) jq empty "$f" 2>/dev/null || { echo "::error file=$f::Invalid JSON"; fail=1; continue; }
                      name=$(jq -r '.name // .title // empty' "$f") ;;
              *)      yq '.' "$f" >/dev/null 2>&1 || { echo "::error file=$f::Invalid YAML"; fail=1; continue; }
                      name=$(yq -r '.name // .title // ""' "$f") ;;
            esac
            if [ -n "$name" ] && [[ "$name" != "[RHA] "* ]]; then
              echo "::error file=$f::Resource name '$name' must start with '[RHA] '"; fail=1
            fi
            echo "ok  $f  ${name:+($name)}"
          done
          exit $fail

  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require a CHANGELOG.md entry
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Add an entry under '## [Unreleased]' in CHANGELOG.md (or label the PR 'skip-changelog')."
            exit 1
          fi

  dt-diff:
    runs-on: ubuntu-latest
    needs: validate
    env:
      DT_ENVIRONMENT: ${{ secrets.DT_ENVIRONMENT }}
      DT_PLATFORM_TOKEN: ${{ secrets.DT_PLATFORM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find changed resources
        id: changed
        run: |
          files=$(scripts/ci/changed-resources.sh "origin/${{ github.base_ref }}" HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Set up dtctl
        if: steps.changed.outputs.files != ''
        run: scripts/ci/dtctl-setup.sh
      - name: Diff against rha75589
        if: steps.changed.outputs.files != ''
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/report.md"
          { echo "<!-- dt-diff -->"; echo "## Dynatrace diff (rha75589)"; echo; } > "$report"
          err=0
          for f in ${{ steps.changed.outputs.files }}; do
            if ! scripts/ci/has-id.sh "$f"; then
              printf '### `%s`\n**New resource**: will be created on merge (ID gets stamped back via a follow-up PR).\n\n' "$f" >> "$report"
              continue
            fi
            out=$(dtctl diff -f "$f" --no-agent 2>&1); rc=$?
            case $rc in
              0) printf '### `%s`\nNo changes vs. the live tenant.\n\n' "$f" >> "$report" ;;
              1) printf '### `%s`\n<details><summary>Changes</summary>\n\n```diff\n%s\n```\n</details>\n\n' "$f" "${out:0:20000}" >> "$report" ;;
              *) printf '### `%s`\n:x: diff failed:\n```\n%s\n```\n\n' "$f" "${out:0:4000}" >> "$report"; err=1 ;;
            esac
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          # Update the existing dt-diff comment, or create one
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                --jq '[.[] | select(.body | startswith("<!-- dt-diff -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@"$report" >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$report"
          fi
          exit $err
