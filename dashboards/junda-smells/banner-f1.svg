<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140103"/><stop offset="1" stop-color="#5c0610"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#b30012"/></linearGradient>
</defs>
<rect width="1200" height="300" fill="url(#bg)"/>
<g stroke="#ff5a5a" stroke-opacity=".35" stroke-width="4" stroke-linecap="round">
<line x1="20" y1="120" x2="170" y2="120"/><line x1="60" y1="160" x2="220" y2="160"/><line x1="10" y1="200" x2="200" y2="200"/><line x1="90" y1="240" x2="230" y2="240"/></g>
<rect y="262" width="1200" height="38" fill="#14090a"/>
<g fill="#fff" fill-opacity=".8"><rect x="40" y="279" width="70" height="5"/><rect x="190" y="279" width="70" height="5"/><rect x="340" y="279" width="70" height="5"/><rect x="490" y="279" width="70" height="5"/><rect x="640" y="279" width="70" height="5"/><rect x="790" y="279" width="70" height="5"/><rect x="940" y="279" width="70" height="5"/><rect x="1090" y="279" width="70" height="5"/></g>
<ellipse cx="640" cy="258" rx="430" ry="10" fill="#000" fill-opacity=".45"/>
<!-- rear wing -->
<rect x="268" y="132" width="10" height="70" fill="#222"/>
<rect x="228" y="100" width="18" height="110" rx="3" fill="#1a1a1a"/>
<rect x="232" y="104" width="96" height="16" rx="4" fill="url(#body)"/>
<rect x="236" y="124" width="84" height="9" rx="3" fill="#fff"/>
<!-- floor + body -->
<path d="M262,236 L1000,236 L1000,228 L262,226 Z" fill="#111"/>
<path stroke="#1a0000" stroke-width="3" stroke-linejoin="round" d="M270,226 L270,180 L360,170 L470,160 L520,118 L560,108 L590,140 L640,150 L760,168 L900,192 L1010,212 L1012,222 L930,226 Z" fill="url(#body)"/>
<path d="M380,196 L560,186 L760,192 L930,212 L930,218 L760,204 L560,200 L380,208 Z" fill="#fff"/>
<path d="M520,118 L560,108 L590,140 L560,144 Z" fill="#1a1a1a"/>
<!-- cockpit + halo + helmet -->
<circle cx="640" cy="146" r="17" fill="#ffd400"/><rect x="628" y="140" width="24" height="7" rx="3" fill="#111"/>
<path d="M590,148 Q640,118 700,166" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
<line x1="688" y1="152" x2="690" y2="170" stroke="#111" stroke-width="6"/>
<!-- number -->
<text x="800" y="200" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="26" fill="#fff" transform="rotate(8 800 200)">7</text>
<!-- front wing -->
<path d="M930,236 L1075,236 L1075,226 L950,228 Z" fill="url(#body)"/>
<rect x="1062" y="208" width="14" height="30" rx="2" fill="#1a1a1a"/>
<rect x="940" y="218" width="125" height="5" rx="2" fill="#fff"/>
<!-- wheels -->
<g><circle cx="350" cy="208" r="52" fill="#111"/><circle cx="350" cy="208" r="40" fill="none" stroke="#e10600" stroke-width="4"/><circle cx="350" cy="208" r="20" fill="#3a3a3a"/><circle cx="350" cy="208" r="7" fill="#e10600"/></g>
<g><circle cx="880" cy="212" r="46" fill="#111"/><circle cx="880" cy="212" r="35" fill="none" stroke="#e10600" stroke-width="4"/><circle cx="880" cy="212" r="18" fill="#3a3a3a"/><circle cx="880" cy="212" r="6" fill="#e10600"/></g>
<!-- title -->
<text x="1170" y="70" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-style="italic" font-weight="900" font-size="54" fill="#fff" letter-spacing="2">JUNDA SMELLS</text>
<text x="1170" y="102" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#ffb3b3" letter-spacing="4">HOST &amp; SERVICE TELEMETRY · RHA75589</text>
</svg>
