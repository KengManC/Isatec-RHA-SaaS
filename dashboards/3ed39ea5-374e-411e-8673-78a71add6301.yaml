        **Sean is Happy** · team banner
      type: markdown
    "1":
      content: "# \U0001F499 Sean is Happy\nService response time, infrastructure health and monitoring configuration for **rha75589**. Tiles turn **blue** when healthy, **amber/red** when a threshold is crossed. Source: `dashboards/sean-is-happy/` in the Isatec-RHA-SaaS repo."
      type: markdown
    "2":
      content: '## ⚡ Service performance'
      type: markdown
    "3":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries rt = avg(dt.service.request.response_time)
        | fieldsAdd rt = rt[] / 1000
        | fieldsAdd `Avg response time` = arrayAvg(rt)
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Avg response time
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: <
              customColor: '#134FC9'
              field: Avg response time
              type: number
              value: 500
            - colorMode: custom-color
              comparator: ≥
              customColor: '#C4233B'
              field: Avg response time
              type: number
              value: 500
        singleValue:
          colorThresholdTarget: background
          isIconVisible: true
          label: Avg response time
          labelMode: none
          prefixIcon: ResponseTimeIcon
          recordField: Avg response time
          sparklineSettings:
            record: rt
            variant: area
          trend:
            isVisible: true
        unitsOverrides:
          - baseUnit: count
            cascade: null
            decimals: 1
            delimiter: true
            displayUnit: null
            identifier: Avg response time
            suffix: ' ms'
            unitCategory: unspecified
    "4":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |-
        timeseries p90 = percentile(dt.service.request.response_time, 90)
        | fieldsAdd p90 = p90[] / 1000
        | fieldsAdd `P90 response time` = arrayAvg(p90)
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
