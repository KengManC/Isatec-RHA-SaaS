        Standard host and service health for **rha75589** · source: `dashboards/junda-smells/` in Isatec-RHA-SaaS.
      type: markdown
    "1":
      query: |-
        fetch dt.entity.host
        | summarize Hosts = count()
      title: Hosts
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: ≥
              customColor: '#7A0A12'
              field: Hosts
              type: double
              value: 0
        singleValue:
          colorThresholdTarget: background
          label: Hosts
          labelMode: none
          recordField: Hosts
    "2":
      query: |-
        timeseries cpu = avg(dt.host.cpu.usage)
        | fields `Avg CPU %` = arrayAvg(cpu)
      title: Avg CPU %
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: ≥
              customColor: '#9E0F1E'
              field: Avg CPU %
              type: double
              value: 0
        singleValue:
          colorThresholdTarget: background
          label: Avg CPU %
          labelMode: none
          recordField: Avg CPU %
    "3":
      query: |-
        timeseries mem = avg(dt.host.memory.usage)
        | fields `Avg memory %` = arrayAvg(mem)
      title: Avg memory %
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: ≥
              customColor: '#C4233B'
              field: Avg memory %
              type: double
              value: 0
        singleValue:
          colorThresholdTarget: background
          label: Avg memory %
          labelMode: none
          recordField: Avg memory %
    "4":
      query: |-
        timeseries req = sum(dt.service.request.count)
        | fields Requests = arraySum(req)
      title: Service requests
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: ≥
              customColor: '#D93A4E'
              field: Requests
              type: double
              value: 0
        singleValue:
          colorThresholdTarget: background
          label: Requests
          labelMode: none
          recordField: Requests
    "5":
      query: |-
        timeseries { req = sum(dt.service.request.count), fail = sum(dt.service.request.failure_count) }
        | fields `Failure rate %` = 100 * arraySum(fail) / arraySum(req)
      title: Failure rate %
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: custom-color
              comparator: ≥
              customColor: '#E10600'
              field: Failure rate %
              type: double
              value: 0
        singleValue:
          colorThresholdTarget: background
          label: Failure rate %
          labelMode: none
          recordField: Failure rate %
    "6":
      content: "## \U0001F3CE️ Hosts"
      type: markdown
    "7":
      query: |-
        timeseries v = avg(dt.host.cpu.usage), by: {dt.entity.host}
        | fieldsAdd host = entityName(dt.entity.host)
        | fieldsRemove dt.entity.host
      title: CPU usage % by host
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "8":
      query: |-
        timeseries v = avg(dt.host.memory.usage), by: {dt.entity.host}
        | fieldsAdd host = entityName(dt.entity.host)
        | fieldsRemove dt.entity.host
      title: Memory usage % by host
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "9":
      query: |-
        timeseries v = max(dt.host.disk.used.percent), by: {dt.entity.host}
        | fieldsAdd host = entityName(dt.entity.host)
        | fieldsRemove dt.entity.host
      title: Disk used % by host
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "10":
      query: timeseries { received = sum(dt.host.net.nic.bytes_rx), sent = sum(dt.host.net.nic.bytes_tx) }
      title: Network traffic (all hosts)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "11":
      query: |-
        timeseries v = avg(dt.host.cpu.load5m), by: {dt.entity.host}
        | fieldsAdd host = entityName(dt.entity.host)
        | fieldsRemove dt.entity.host
      title: CPU load (5m) by host
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "12":
      query: |-
        timeseries { cpu = avg(dt.host.cpu.usage), mem = avg(dt.host.memory.usage), disk = max(dt.host.disk.used.percent) }, by: {dt.entity.host}
        | fields Host = entityName(dt.entity.host), `CPU %` = arrayAvg(cpu), `Memory %` = arrayAvg(mem), `Max disk %` = arrayMax(disk)
        | sort `CPU %` desc
      title: Host overview
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - color: '#C4233B'
              colorMode: single-color
              comparator: ≥
              field: CPU %
              type: double
              value: 80
    "13":
      content: "## \U0001F3CE️ Services"
      type: markdown
    "14":
      query: |-
        timeseries v = sum(dt.service.request.count), by: {dt.entity.service}
        | fieldsAdd service = entityName(dt.entity.service)
        | fieldsRemove dt.entity.service
      title: Requests by service
      type: data
      visualization: barChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "15":
      query: |-
        timeseries v = avg(dt.service.request.response_time), by: {dt.entity.service}
        | fieldsAdd service = entityName(dt.entity.service)
        | fieldsRemove dt.entity.service
      title: Response time by service
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
