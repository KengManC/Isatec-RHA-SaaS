              value: ""
    "16":
      query: |-
        timeseries v = sum(dt.service.request.failure_count), by: {dt.entity.service}
        | fieldsAdd service = entityName(dt.entity.service)
        | fieldsRemove dt.entity.service
      title: Failed requests by service
      type: data
      visualization: barChart
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - colorMode: color-palette
              colorPalette: red
              comparator: = *value*
              field: DT.name
              type: string
              value: ""
    "17":
      query: |-
        timeseries { req = sum(dt.service.request.count), fail = sum(dt.service.request.failure_count), rt = avg(dt.service.request.response_time) }, by: {dt.entity.service}
        | fields Service = entityName(dt.entity.service), Requests = arraySum(req), Failures = arraySum(fail), `Avg response time (µs)` = arrayAvg(rt)
        | sort Requests desc
      title: Service overview
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
        coloring:
          colorRules:
            - color: '#C4233B'
              colorMode: single-color
              comparator: ≥
              field: Failures
              type: double
              value: 1
